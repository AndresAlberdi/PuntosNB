# Generado desde el estándar DevSecOps (02-pipelines/config/dependabot.yml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # `github/codeql-action` tiene varias rutas —`init`, `analyze`, `upload-sarif`— y CodeQL
    # EXIGE que todas corran en la misma version. Dependabot las ve como dependencias distintas
    # y abre un PR por cada una; fusionar una sola rompe la compuerta con
    #   "Loaded a configuration file for version X, but running version Y"
    # Ya paso el 20-sep-2026 (PR #15 y #16) y volvio a pasar el 01-oct (#69 y #71, sin ninguno
    # para `init`). Agrupadas, Dependabot propone un unico PR con las tres.
    groups:
      codeql-action:
        patterns:
          - 'github/codeql-action*'
    # Cuarentena de 7 dias para versiones recien publicadas, igual que
    # `minimumReleaseAge: 10080` en `.npmrc`: una version comprometida suele
    # detectarse y retirarse en los primeros dias, y no hay motivo para ser
    # el primero en instalarla.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/La_Paz
    open-pull-requests-limit: 5
    labels: [dependencias, github-actions, seguridad]
  - package-ecosystem: npm
    directory: /
    # Cuarentena de 7 dias para versiones recien publicadas, igual que
    # `minimumReleaseAge: 10080` en `.npmrc`: una version comprometida suele
    # detectarse y retirarse en los primeros dias, y no hay motivo para ser
    # el primero en instalarla.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/La_Paz
    open-pull-requests-limit: 10
    labels: [dependencias, npm]

  # `functions/` tiene su propio `package.json` y su propio `package-lock.json`,
  # porque Firebase sube esa carpeta sin `node_modules` y la compila en la nube
  # con `npm ci`. Sin esta entrada, Dependabot actualiza `functions/package.json`
  # desde el ecosistema raíz pero deja su lockfile atrás, y el despliegue falla
  # en el hook `predeploy` con "lock file's X does not satisfy Y" — que es
  # exactamente lo que ocurrió el 20/09/2026 al fusionar la subida de TypeScript.
  #
  # Desde que `functions/` salió del espacio de trabajo de pnpm, esta es la ÚNICA entrada
  # que propone actualizaciones para `functions/package.json`, y las propone junto con su
  # lockfile. Antes, la entrada de la raíz también lo alcanzaba como miembro del espacio de
  # trabajo: cada PR actualizaba un lockfile y dejaba el otro (#46 y #49).
  - package-ecosystem: npm
    directory: /functions
    # Cuarentena de 7 dias para versiones recien publicadas, igual que
    # `minimumReleaseAge: 10080` en `.npmrc`: una version comprometida suele
    # detectarse y retirarse en los primeros dias, y no hay motivo para ser
    # el primero en instalarla.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/La_Paz
    open-pull-requests-limit: 5
    labels: [dependencias, npm, functions]
