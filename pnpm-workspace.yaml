# Un solo espacio de trabajo con la aplicación y las funciones: una sola instalación
# reproducible, un solo lockfile. `functions/` conserva su package.json y su tsconfig.
packages:
  - '.'
  - 'functions'

# Un paquete recién publicado es el vehículo habitual de un ataque a la cadena de suministro:
# se compromete una cuenta, se publica una versión con código malicioso y se espera a que los
# equipos la instalen en las horas siguientes. Estas tres opciones cierran esa ventana.
minimumReleaseAge: 10080        # siete días de cuarentena antes de instalar una versión nueva
blockExoticSubdeps: true        # ninguna dependencia transitiva desde un origen que no sea el registro

# `trustPolicy: no-downgrade` queda pendiente a propósito. Al activarlo, la instalación se
# detiene en `@babel/core@7.29.7`: versiones anteriores traían atestación de procedencia y esta
# no. Es exactamente la señal que la opción busca dar, y merece revisarse con calma —muy
# probablemente sea un cambio en el proceso de publicación de Babel, no un incidente—, pero no
# se resuelve dejando el repositorio sin poder instalar. Se retoma al renovar las excepciones,
# el 18-dic-2026.

# Scripts de instalación de dependencias: decisión explícita, paquete por paquete.
#
# Por defecto no se ejecuta ninguno (`ignore-scripts` en .npmrc): un paquete
# comprometido no debe poder correr código solo por instalarse. Estos tres piden
# ejecutarlos; se revisaron y la aplicación funciona sin ellos, así que quedan en
# `false`. Si alguno llegara a hacer falta, se cambia aquí con su motivo.
allowBuilds:
  '@firebase/util': false   # postinstall de conveniencia
  protobufjs: false         # genera tipos que ya vienen empaquetados
  re2: false                # binario nativo; solo lo usa firebase-tools en local

# Anulaciones de seguridad: se fuerza una version con parche de una dependencia transitiva.
# Se retiran cuando los paquetes que la arrastran suban por su cuenta.
#
# brace-expansion — CVE-2026-102276 y CVE-2026-102278, ambos de severidad ALTA. El arbol
# resolvia 1.1.18, 2.1.4 y 5.0.9, las tres vulnerables. No lo introdujo ninguna actualizacion:
# ya estaba en `main`, y los avisos se publicaron despues del ultimo analisis, de modo que la
# base de datos de Trivy recien ahora lo marca. El lockfile de npm de `functions/` ya habia
# resuelto versiones corregidas por su cuenta; este es el lado de pnpm.
overrides:
  brace-expansion@1: ^1.1.20
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
