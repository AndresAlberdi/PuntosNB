# Manifiesto del estándar DevSecOps (esquema: 02-pipelines/config/devsecops.schema.json;
# convenciones: 00-gobernanza/00-convenciones.md; generado por bootstrap-repo.sh v2.0)
version: 1
proyecto: hipatia-puntos
modo: A            # A | B | B0 (ver 00-gobernanza/03-ambientes-modos-y-aprobaciones.md)
# La cobertura que mide Vitest es la del código de interfaz, donde las pruebas son pocas.
# Lo que de verdad está cubierto vive en dos suites aparte que este número no refleja:
# 347 pruebas de reglas de Firestore y 50 de integración de las Cloud Functions.
# 50 es el piso real de hoy; conviene subirlo a medida que la interfaz gane pruebas.
cobertura_minima: 50
componentes:
  - nombre: hipatia-puntos
    ruta: ./
    stack: node
    proveedor: firebase
    ambientes:
      staging:
        proyecto: puntosnb
        url: https://puntosnb.web.app
        region: us-central1
      production:
        proyecto: hipatia-puntos
        url: https://hipatia-puntos.web.app
        region: us-central1
seguridad:
  dast: true
  zap_reglas: .github/zap-rules.tsv
  bloquear_en: [CRITICAL, HIGH]   # se puede endurecer (añadir MEDIUM), nunca relajar
  excepciones:
    # La clave web de Firebase y la clave de sitio de reCAPTCHA no son secretos: por diseño
    # viajan en el paquete que descarga cualquier visitante y Google las documenta así. Lo que
    # las protege es la restricción por dominio de la clave de API y App Check, no el secreto.
    # La allowlist de .github/gitleaks.toml ya las cubre en gitleaks reciente; estas excepciones
    # son para la versión que corre en el pipeline, que interpreta la allowlist de otra manera.
    # Se listan por huella exacta: cualquier otro hallazgo en esos mismos archivos sigue
    # bloqueando. Vencen el 18-dic-2026, el máximo que admite el estándar para un hallazgo
    # crítico: al renovarlas conviene revisar si gitleaks ya respeta la allowlist del archivo
    # de configuración, en cuyo caso estas excepciones sobran.
    - id: "c2567c26171ac336a7d725bba75ab9ceef35160d:.env.staging:generic-api-key:9"
      herramienta: gitleaks
      justificacion: "Configuración web pública de Firebase (clave de API y clave de sitio de reCAPTCHA); no es un secreto."
